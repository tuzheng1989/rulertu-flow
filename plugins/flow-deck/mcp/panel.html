<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Issues · flow-deck</title>
<style>
  /* 主题变量来自宿主 hostContext.styles.variables（MCP Apps 协议下发），此处只给 fallback */
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
    font-size: var(--font-text-sm-size, 13px);
    line-height: var(--font-text-sm-line-height, 20px);
    background: var(--color-background-primary, #ffffff);
    color: var(--color-text-primary, #1f2328);
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; position: sticky; top: 0;
    background: var(--color-background-primary, #ffffff);
    border-bottom: 1px solid var(--color-border-primary, #d0d7de);
  }
  header .dot { width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--color-background-success, #1a7f37); }
  header h1 { font-size: var(--font-text-md-size, 14px); font-weight: var(--font-weight-medium, 500);
    margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .meta { color: var(--color-text-tertiary, #6e7781); flex: none; }
  button {
    font: inherit; color: var(--color-text-info, #0969da);
    background: var(--color-background-secondary, #f6f8fa);
    border: 1px solid var(--color-border-primary, #d0d7de);
    border-radius: var(--border-radius-sm, 6px);
    padding: 2px 10px; cursor: pointer; flex: none;
  }
  button:hover { background: var(--color-background-tertiary, #eff2f5); }
  button:disabled { color: var(--color-text-disabled, #8c959f); cursor: default; }
  .issue {
    display: flex; align-items: baseline; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--color-border-secondary, #d8dee4);
  }
  .issue:last-child { border-bottom: none; }
  .issue .num { color: var(--color-text-tertiary, #6e7781); flex: none; }
  .issue .main { flex: 1; min-width: 0; }
  .issue .title {
    color: var(--color-text-primary, #1f2328); cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: block; text-align: left;
  }
  .issue .title.plain { cursor: default; }
  .issue .title:hover:not(.plain) { color: var(--color-text-info, #0969da); }
  .issue .labels { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .issue .label {
    font-size: var(--font-text-xs-size, 11px); line-height: var(--font-text-xs-line-height, 16px);
    color: var(--color-text-secondary, #57606a);
    background: var(--color-background-secondary, #f6f8fa);
    border: 1px solid var(--color-border-secondary, #d8dee4);
    border-radius: var(--border-radius-xs, 999px); padding: 0 7px;
  }
  .issue .claim { align-self: center; }
  .status { padding: 24px 16px; text-align: center;
    color: var(--color-text-secondary, #57606a); }
  .status.ok { color: var(--color-text-success, #1a7f37); }
  .status .retry { margin-top: 8px; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px;
    background: var(--color-background-inverse, #24292f);
    color: var(--color-text-inverse, #ffffff);
    border-radius: var(--border-radius-sm, 6px); padding: 6px 14px;
    font-size: var(--font-text-xs-size, 11px); max-width: 90%;
  }
</style>
</head>
<body>
<header>
  <span class="dot" aria-hidden="true"></span>
  <h1>GitHub Issues · <span id="count">…</span> open</h1>
  <span class="meta" id="meta"></span>
  <button id="refresh" title="忽略 60s 缓存强制重拉">刷新</button>
</header>
<main id="list"><div class="status">加载中…</div></main>
<script>
'use strict'
// ---- MCP Apps 最小桥客户端（对照官方 zcode-site 0.5.0 面板 bundle 手写翻译）----
// 信封：JSON-RPC 2.0 对象经 window.parent.postMessage 直传；响按 id 匹配。
const PROTOCOL_VERSION = '2026-01-26'
const ISSUES_URI = 'ui://flow-deck/issues.json'
const bridge = {
  nextId: 1,
  pending: new Map(),
  hostCapabilities: null,
  hostContext: null,
  onHostContextChanged: null,
}
window.addEventListener('message', (event) => {
  const data = event.data
  if (!data || data.jsonrpc !== '2.0') return
  if (data.id !== undefined && (data.result !== undefined || data.error !== undefined)) {
    const entry = bridge.pending.get(Number(data.id))
    if (!entry) return
    bridge.pending.delete(Number(data.id))
    clearTimeout(entry.timer)
    if (data.error) entry.reject(new Error(data.error.message || 'JSON-RPC error'))
    else entry.resolve(data.result)
  } else if (data.method === 'ui/notifications/host-context-changed') {
    applyHostContext(data.params || {})
  }
})
function request(method, params, timeoutMs = 30000) {
  return new Promise((resolve, reject) => {
    const id = bridge.nextId++
    const timer = setTimeout(() => {
      bridge.pending.delete(id)
      reject(new Error(`桥请求超时：${method}`))
    }, timeoutMs)
    bridge.pending.set(id, {
      resolve: (value) => resolve(value),
      reject: (error) => reject(error),
      timer,
    })
    window.parent.postMessage({ jsonrpc: '2.0', id, method, params: params ?? {} }, '*')
  })
}
function notify(method, params) {
  window.parent.postMessage({ jsonrpc: '2.0', method, params: params ?? {} }, '*')
}
async function connect() {
  const result = await request('ui/initialize', {
    appInfo: { name: 'flow-deck-issues', version: '0.24.0' },
    appCapabilities: {},
    protocolVersion: PROTOCOL_VERSION,
  })
  bridge.hostCapabilities = result.hostCapabilities || {}
  applyHostContext(result.hostContext || {})
  notify('ui/notifications/initialized', {})
}
// ---- 主题：hostContext.styles.variables 逐个落到 :root，theme 驱动 color-scheme ----
function applyHostContext(context) {
  bridge.hostContext = Object.assign({}, bridge.hostContext, context)
  const theme = bridge.hostContext && bridge.hostContext.theme
  if (theme === 'light' || theme === 'dark') {
    document.documentElement.setAttribute('data-theme', theme)
    document.documentElement.style.colorScheme = theme
  }
  const variables = bridge.hostContext && bridge.hostContext.styles && bridge.hostContext.styles.variables
  if (variables) {
    for (const [name, value] of Object.entries(variables)) {
      if (typeof value === 'string') document.documentElement.style.setProperty(name, value)
    }
  }
  if (bridge.onHostContextChanged) bridge.onHostContextChanged()
}
// ---- 数据加载 ----
async function loadIssues(force) {
  if (force) {
    const result = await request('tools/call', { name: 'refresh_issues', arguments: {} })
    if (result.structuredContent) return result.structuredContent
    const text = result.content && result.content[0] && result.content[0].text
    if (text) return JSON.parse(text)
    throw new Error('refresh_issues 无有效返回')
  }
  const result = await request('resources/read', { uri: ISSUES_URI })
  const text = result.contents && result.contents[0] && result.contents[0].text
  if (!text) throw new Error('issues.json 无有效返回')
  return JSON.parse(text)
}
// ---- 渲染 ----
const listEl = document.getElementById('list')
const countEl = document.getElementById('count')
const metaEl = document.getElementById('meta')
const refreshBtn = document.getElementById('refresh')
function renderStatus(text, className) {
  listEl.replaceChildren()
  const div = document.createElement('div')
  div.className = `status${className ? ' ' + className : ''}`
  div.textContent = text
  listEl.appendChild(div)
}
function renderError(message) {
  listEl.replaceChildren()
  const div = document.createElement('div')
  div.className = 'status'
  div.textContent = `⚠ ${message}`
  const retry = document.createElement('button')
  retry.className = 'retry'
  retry.textContent = '重试'
  retry.addEventListener('click', () => { refresh(true) })
  div.appendChild(document.createElement('br'))
  div.appendChild(retry)
  listEl.appendChild(div)
}
function describeInterval(ms) {
  const seconds = Math.max(0, Math.round(ms / 1000))
  if (seconds < 5) return '刚刚'
  if (seconds < 60) return `${seconds}s 前`
  return `${Math.round(seconds / 60)}m 前`
}
function renderIssues(payload) {
  if (payload.error) { countEl.textContent = '–'; metaEl.textContent = ''; renderError(payload.message); return }
  const issues = payload.issues || []
  countEl.textContent = String(issues.length)
  metaEl.textContent = payload.fetchedAt ? describeInterval(Date.now() - payload.fetchedAt) : ''
  listEl.replaceChildren()
  if (issues.length === 0) { renderStatus('✓ 无 open issue', 'ok'); return }
  const canOpen = !!(bridge.hostCapabilities && bridge.hostCapabilities.openLinks)
  const canClaim = !!(bridge.hostCapabilities && bridge.hostCapabilities.message)
  for (const issue of issues) {
    const row = document.createElement('div')
    row.className = 'issue'
    const num = document.createElement('span')
    num.className = 'num'
    num.textContent = `#${issue.number}`
    const main = document.createElement('div')
    main.className = 'main'
    const title = document.createElement('span')
    title.className = canOpen ? 'title' : 'title plain'
    title.textContent = issue.title
    title.title = issue.title
    if (canOpen) {
      title.addEventListener('click', () => {
        request('ui/open-link', { url: issue.url }).catch(() => {})
      })
    }
    main.appendChild(title)
    if (Array.isArray(issue.labels) && issue.labels.length > 0) {
      const labels = document.createElement('div')
      labels.className = 'labels'
      for (const name of issue.labels) {
        const label = document.createElement('span')
        label.className = 'label'
        label.textContent = name
        labels.appendChild(label)
      }
      main.appendChild(labels)
    }
    row.appendChild(num)
    row.appendChild(main)
    if (canClaim) {
      const claim = document.createElement('button')
      claim.className = 'claim'
      claim.textContent = '认领'
      claim.addEventListener('click', async () => {
        claim.disabled = true
        try {
          await request('ui/message', {
            role: 'user',
            content: [{ type: 'text', text: `认领并开始处理 issue #${issue.number}：${issue.title}（${issue.url}）` }],
          })
          toast(`已回传 issue #${issue.number}，切回会话继续`)
        } catch (error) {
          claim.disabled = false
          toast(`回传失败：${error.message}`)
        }
      })
      row.appendChild(claim)
    }
    listEl.appendChild(row)
  }
}
let toastTimer = 0
function toast(text) {
  let el = document.querySelector('.toast')
  if (!el) {
    el = document.createElement('div')
    el.className = 'toast'
    document.body.appendChild(el)
  }
  el.textContent = text
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => { el.remove() }, 2600)
}
let loading = false
async function refresh(force) {
  if (loading) return
  loading = true
  refreshBtn.disabled = true
  if (force) renderStatus('刷新中…')
  try {
    const payload = await loadIssues(force)
    renderIssues(payload)
  } catch (error) {
    renderError(error.message)
  } finally {
    loading = false
    refreshBtn.disabled = false
  }
}
refreshBtn.addEventListener('click', () => { refresh(true) })
bridge.onHostContextChanged = () => { /* 主题变量已由 applyHostContext 落地，无需重绘 */ }
// ---- 启动：握手 → 首拉（read 走 60s 缓存）----
connect()
  .then(() => refresh(false))
  .catch((error) => renderError(`面板桥连接失败：${error.message}`))
</script>
</body>
</html>
